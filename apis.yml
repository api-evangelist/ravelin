- aid: ravelin:ravelin-callbacks-api
  name: Ravelin Callbacks API
  description: >-
    Outbound webhook callbacks delivered by Ravelin to merchant-configured endpoints when manual reviews,
    order decisions, or refund decisions are completed in the Ravelin dashboard. Used to keep order-management,
    fulfillment, and customer-service systems in sync with Ravelin's human-in-the-loop review outcomes.
  humanURL: https://developer.ravelin.com/merchant/api/callbacks/order-decisions/
