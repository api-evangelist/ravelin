- aid: ravelin:ravelin-psp-api
  name: Ravelin PSP API
  description: >-
    A purpose-built API surface for Payment Service Providers (PSPs) embedding Ravelin's risk scoring
    and dispute capture into their own merchant-facing product. Exposes Score, Transaction, Dispute, and
    the full 3D Secure operation set under the same authentication and decision envelope as the Merchant
    API.
  humanURL: https://developer.ravelin.com/
  baseURL: https://api.ravelin.com
  tags:
  - Fraud Prevention
